<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="내기골프계산기 - 스트로크 · 팀전(뽑기) 골프 내기 자동 정산">
<meta name="theme-color" content="#0E3A2B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F0D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-any.png">
<link rel="apple-touch-icon" href="icons/icon-192-any.png">
<title>내기골프계산기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Dancing+Script:wght@700&display=swap');

  :root{
    --bg:#E8E2D4;
    --surface:#F7F3EA;
    --surface-2:#EEE8DB;
    --ink:#121A16;
    --muted:#6F7671;
    --accent:#0E3A2B;
    --accent-dark:#0A2A1F;
    --accent-ink:#F6F1E4;
    --gold:#A5824A;
    --win:#1D6B49;
    --win-bg:#E7EFEA;
    --lose:#9A2E2E;
    --lose-bg:#F5E8E5;
    --line:#D9D1BF;
    --shadow: 0 1px 0 rgba(18,26,22,.04);
    --red:#A7342F; --red-bg:#F2E0DD; --blue:#264E8A; --blue-bg:#E0E6F0;
    --sel:#1B7A52; --sel-ink:#FFFFFF; --sel-ring:rgba(27,122,82,.35);
    --cele:linear-gradient(100deg,#6E4400 0%,#B8820F 28%,#E9C35A 46%,#B8820F 64%,#6E4400 100%);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0F0D;
      --surface:#131916;
      --surface-2:#1A211D;
      --ink:#ECE7DC;
      --muted:#8C958F;
      --accent:#C4A26A;
      --accent-dark:#DCC08E;
      --accent-ink:#101512;
      --gold:#D2B57E;
      --win:#6FC29B;
      --win-bg:#15261E;
      --lose:#E38B7F;
      --lose-bg:#2D1B19;
      --line:#262E2A;
      --shadow: 0 1px 0 rgba(0,0,0,.4);
      --red:#E27B70; --red-bg:#2C1917; --blue:#83A6DC; --blue-bg:#172030;
      --sel:#EAC47E; --sel-ink:#141A16; --sel-ring:rgba(234,196,126,.35);
      --cele:linear-gradient(100deg,#B98A2A 0%,#F6D77A 30%,#FFF6D2 45%,#E7B23E 60%,#B98A2A 100%);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0F0D;
    --surface:#131916;
    --surface-2:#1A211D;
    --ink:#ECE7DC;
    --muted:#8C958F;
    --accent:#C4A26A;
    --accent-dark:#DCC08E;
    --accent-ink:#101512;
    --gold:#D2B57E;
    --win:#6FC29B;
    --win-bg:#15261E;
    --lose:#E38B7F;
    --lose-bg:#2D1B19;
    --line:#262E2A;
    --shadow: 0 1px 0 rgba(0,0,0,.4);
    --red:#E27B70; --red-bg:#2C1917; --blue:#83A6DC; --blue-bg:#172030;
    --sel:#EAC47E; --sel-ink:#141A16; --sel-ring:rgba(234,196,126,.35);
    --cele:linear-gradient(100deg,#B98A2A 0%,#F6D77A 30%,#FFF6D2 45%,#E7B23E 60%,#B98A2A 100%);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    padding-inline:12px;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3{ margin:0; text-wrap:balance; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; }
  input, select, textarea{ border-radius:0; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--accent); outline-offset:2px;
  }

  .app{ max-width:480px; margin:0 auto; padding-block:10px 84px; display:flex; flex-direction:column; gap:8px; }

  header.top{
    display:flex; align-items:center; gap:10px;
    padding-block:2px;
  }
  .brand{ flex:1; min-width:0; display:flex; align-items:baseline; gap:8px; overflow:hidden; }
  .brand h1{ font-size:20px; font-weight:900; color:var(--accent-dark); letter-spacing:-.3px; white-space:nowrap; }
  .brand .sub{ font-size:11px; color:var(--gold); letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    width:34px;height:34px;border-radius:4px; display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:16px; flex:none;
  }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:4px;
    padding:12px 14px; box-shadow:var(--shadow);
  }
  .card + .card{ margin-top:0; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-block:10px 0; }
  .field:first-child{ margin-block-start:0; }
  label.field-label{ font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.3px; }
  .field-hint{ font-size:12px; color:var(--muted); margin-top:-2px; }

  .text-input, input[type=text].plain, input[type=date].plain{
    width:100%; padding:9px 10px; border-radius:0; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:15px; font-family:inherit;
  }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .three-col{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .three-col label, .mini-label{ display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .two-col .money-spin{ width:100%; }

  .stepper-row{ display:flex; align-items:center; gap:10px; }
  .stepper-btn{
    width:38px;height:38px;border-radius:4px;border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:19px; font-weight:700;
    cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .stepper-btn:active{ transform:scale(.94); }
  .stepper-val{
    min-width:54px; text-align:center; font-size:22px; font-weight:700;
    
  }

  .name-list{ display:flex; flex-direction:column; gap:6px; }
  .name-row{ display:flex; align-items:flex-end; gap:8px; }
  .name-row .dot{ width:10px;height:10px;border-radius:50%; flex:none; margin-bottom:11px; }
  .name-row input[type=text]{
    flex:1 1 60px; min-width:0; padding:9px 10px; border-radius:0; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:15px;
  }
  .handi-col{ display:flex; flex-direction:column; gap:3px; flex:0 0 108px; }
  .handi-col label{ font-size:10px; font-weight:700; color:var(--muted); padding-right:2px; }
  .handi-col input[type=number]{
    width:100%; padding:9px 10px; border-radius:0; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:14px; font-weight:700; text-align:right;
    
  }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    padding:7px 12px; border-radius:4px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
  }
  .chip{ color:var(--muted); }
  .chip[aria-pressed="true"]{
    background:var(--sel); border-color:var(--sel); color:var(--sel-ink); font-weight:800;
    box-shadow:0 0 0 2px var(--sel-ring), 0 2px 6px -1px var(--sel-ring);
  }
  .chip.small{ padding:6px 12px; font-size:13px; }
  .chip.warn[aria-pressed="true"]{ background:var(--gold); border-color:var(--gold); color:var(--accent-ink); }
  .chip.nl[aria-pressed="true"]{ background:var(--gold); border-color:var(--gold); color:var(--accent-ink); }

  .unit-input{ display:flex; align-items:center; gap:8px; }
  .unit-input input[type=number]{
    width:30%; min-width:88px; flex:none; padding:9px 10px; border-radius:0; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:15px; font-weight:700; text-align:right;
    
  }
  .unit-input span{ font-size:13px; color:var(--muted); flex:none; }

  .primary-btn{
    width:100%; padding:13px; border-radius:4px; border:none; letter-spacing:.5px;
    background:var(--accent); color:var(--accent-ink); font-size:16px; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow);
  }
  .primary-btn:active{ background:var(--accent-dark); }
  .primary-btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .ghost-btn{
    width:100%; padding:11px; border-radius:4px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
  }
  .gold-btn{
    width:100%; padding:12px; border-radius:4px; border:none;
    background:var(--gold); color:var(--accent-ink); font-size:15px; font-weight:700; cursor:pointer;
  }

  /* Play screen */
  .round-meta{ text-align:center; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .round-meta b{ color:var(--ink); }

  .hole-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hole-nav .nav-btn{
    width:36px;height:36px;border-radius:4px;border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:16px; cursor:pointer;
  }
  .hole-nav .nav-btn[disabled]{ opacity:.3; }
  .hole-title{ text-align:center; }
  .hole-title .num{ font-size:26px; font-weight:700; }
  .hole-title .of{ font-size:12px; color:var(--muted); }

  .par-row{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px; }
  .par-row span.lbl{ font-size:12px; color:var(--muted); margin-right:2px; }

  .baepan-badge{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:6px; padding:6px 10px; border-radius:4px;
    background:var(--lose-bg); color:var(--lose); font-size:13px; font-weight:700;
  }
  .bonus-summary{
    text-align:center; font-size:12px; font-weight:700; color:var(--gold); margin-top:8px;
  }

  .cond-row{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
  .cond-badge{
    font-size:11px; padding:4px 8px; border-radius:3px; background:var(--surface-2); color:var(--muted); font-weight:600;
  }
  .cond-badge.on{ background:var(--win-bg); color:var(--win); }

  .score-row{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; padding-block:8px;
    border-top:1px solid var(--line);
  }
  .score-row:first-of-type{ border-top:none; }
  .score-row .pname{ min-width:0; font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score-row .dot{ width:9px;height:9px;border-radius:50%; flex:none; }
  .score-row .name-part{ display:flex; align-items:center; gap:8px; flex:1 1 72px; min-width:0; }
  .score-row .stepper-row{ flex:none; gap:6px; }
  .score-row .stepper-btn{ width:34px; height:34px; font-size:17px; }
  .score-row .stepper-val{ min-width:32px; font-size:18px; }
  .nl-toggle{
    height:34px; padding:0 10px; border-radius:4px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--muted); font-size:11px; font-weight:700; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; white-space:nowrap;
  }
  .nl-toggle[aria-pressed="true"]{ background:var(--gold); border-color:var(--gold); color:var(--accent-ink); }

  .hole-money{
    margin-top:4px; padding-top:8px; border-top:1px dashed var(--line);
    font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:6px;
  }
  .hole-money .line{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .hole-money .payer{ flex:1; min-width:0; }
  .hole-money .payer .pname-inline{ color:var(--ink); font-weight:700; }
  .hole-money .payer .to-list{ font-size:11px; color:var(--muted); font-weight:400; margin-left:6px; }
  .hole-money b{ color:var(--ink); flex:none; white-space:nowrap; }

  .scoreboard{ display:flex; flex-direction:column; gap:4px; }
  .sb-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    background:var(--surface-2); border-radius:4px;
  }
  .sb-row .rank{ font-size:12px; color:var(--muted); width:16px; flex:none; }
  .sb-row .pname{ flex:1; min-width:0; font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sb-row .strokes{ font-size:11px; color:var(--muted); flex:none; }
  .sb-row .money{  font-weight:700; font-size:16px; flex:none; min-width:74px; text-align:right; }
  .money.pos{ color:var(--win); }
  .money.neg{ color:var(--lose); }
  .money.zero{ color:var(--muted); }

  .section-label{ font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.3px; margin-block-end:6px; }

  /* Summary */
  .final-row{
    display:flex; align-items:center; gap:10px; padding:10px; border-radius:4px;
    background:var(--surface-2);
  }
  .final-row .medal{ font-size:20px; width:26px; text-align:center; flex:none; }
  .final-row .meta{ flex:1; min-width:0; }
  .final-row .pname{ font-weight:700; font-size:15px; }
  .final-row .strokes{ font-size:12px; color:var(--muted); }
  .final-row .rel-sum{ font-size:13px; font-weight:700; color:var(--gold); margin-left:6px; }
  .final-row .tot-strokes{ font-size:13px; font-weight:500; color:var(--muted); margin-left:6px; }
  .final-row .money{  font-weight:700; font-size:19px; flex:none; }

  .settle-list{ display:flex; flex-direction:column; gap:4px; }
  .settle-item{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:4px;
    background:var(--bg); border:1px solid var(--line); font-size:14px;
  }
  .settle-item b{ font-weight:700; }
  .settle-item .arrow{ color:var(--gold); font-weight:700; }
  .settle-item .amt{ margin-left:auto;  font-weight:700; color:var(--gold); }

  /* History */
  .hist-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:4px;
    background:var(--surface-2); cursor:pointer; text-align:left; border:none; width:100%; color:var(--ink);
  }
  .hist-item .meta{ flex:1; min-width:0; }
  .hist-item .date{ font-size:12px; color:var(--muted); }
  .hist-item .players{ font-size:14px; font-weight:700; margin-top:2px; }
  .hist-item .top{ font-size:12px; color:var(--gold); margin-top:2px; }
  .empty-note{ font-size:14px; color:var(--muted); text-align:center; padding:18px 12px; }

  .hole-log{ display:flex; flex-direction:column; gap:6px; }
  .hole-log-row{
    display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0;
    border-top:1px solid var(--line);
  }
  .hole-log-row:first-child{ border-top:none; }
  .hole-log-row .hn{ width:48px; flex:none; color:var(--muted); font-weight:700; }
  .hole-log-row .scores{ flex:1; min-width:0; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hole-log-row .x2{ flex:none; font-size:11px; font-weight:700; color:var(--lose); background:var(--lose-bg); padding:2px 6px; border-radius:6px; }

  /* Share panel */
  .share-box textarea{
    width:100%; min-height:160px; padding:10px; border-radius:0; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:13px; font-family:inherit; resize:vertical;
    line-height:1.5;
  }
  .share-actions{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .share-link{
    display:block; text-align:center; padding:11px; border-radius:4px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font-size:14px; font-weight:600; text-decoration:none;
  }
  .copy-note{ font-size:12px; color:var(--win); text-align:center; margin-top:8px; min-height:14px; }

  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .bottom-bar .inner{ max-width:480px; margin:0 auto; display:flex; gap:6px; }

  /* Mode select */
  .mode-intro{ font-size:12px; color:var(--muted); letter-spacing:.3px; padding:2px 2px 6px; }
  #screen-mode:not([hidden]){ min-height:calc(100vh - 110px); min-height:calc(100dvh - 110px); display:flex; flex-direction:column; justify-content:center; }
  .mode-intro{ text-align:center; }
  .mode-list{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .mode-list > .mode-card{ min-width:0; }
  .mode-card{
    position:relative; display:flex; flex-direction:column; align-items:center; text-align:center;
    width:100%; aspect-ratio:1/1; padding:8px 6px; justify-content:center; overflow:hidden;
    border:1px solid var(--line); border-radius:4px; background:var(--surface); color:var(--ink);
    cursor:pointer; box-shadow:var(--shadow);
  }
  .mode-card .art{ display:flex; align-items:flex-end; justify-content:center; gap:2px; height:40px; margin-bottom:6px; --eye:var(--surface); }
  .mode-card .art .ic{ width:40px; height:40px; }
  .mode-card .art .ic.r{ color:var(--red); }
  .mode-card .art .ic.b{ color:var(--blue); }
  .mode-card .art .ic.g{ color:var(--accent-dark); }
  .mode-card .d{ font-size:11.5px; line-height:1.45; }
  .mode-card .go{ padding-top:6px; font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.4px; }
  .mode-card:active{ background:var(--surface-2); }
  .mode-card .tag{ font-size:11px; font-weight:700; color:var(--gold); letter-spacing:.8px; margin-bottom:4px; }
  .mode-card .t{ font-size:20px; font-weight:900; color:var(--accent-dark); letter-spacing:-.3px; }
  .mode-card .d{ font-size:13px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .ic .eye{ fill:var(--eye, #fff); }

  /* Team mode */
  .name-list.no-handi .handi-col{ display:none; }
  .name-stack{ display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; min-width:0; gap:3px 6px; }
  .name-stack .pname{ flex:0 1 auto; }
  .name-stack > :not(.pname){ flex:none; }
  .two-col .unit-input input[type=number]{ width:0; flex:1 1 0; min-width:0; }
  .two-col > .field{ margin-block-start:10px; min-width:0; }
  .two-col .unit-input span{ font-size:12px; }
  .draw-btn{
    height:24px; padding:0 10px; border:1px dashed var(--gold); background:transparent; color:var(--gold);
    font-size:11px; font-weight:700; border-radius:3px; cursor:pointer;
  }
  .ball{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:3px; font-size:11px; font-weight:700; white-space:nowrap; }
  .ball .ic{ width:16px; height:16px; margin-left:-3px; }
  .ball.R{ --eye:var(--red-bg); } .ball.B{ --eye:var(--blue-bg); }
  .ball.R{ background:var(--red-bg); color:var(--red); }
  .ball.B{ background:var(--blue-bg); color:var(--blue); }
  .ball.J{ background:#111; color:#fff; box-shadow:0 0 0 1px rgba(255,255,255,.18); }
  .draw-actions{ display:flex; gap:6px; margin-top:4px; }
  .draw-actions .ghost-btn{ padding:9px; font-size:13px; }
  .team-box{ display:flex; flex-direction:column; gap:4px; }
  .team-line{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:4px; font-size:13px; }
  .team-line.R{ background:var(--red-bg); }
  .team-line.B{ background:var(--blue-bg); }
  .team-line.win{ box-shadow: inset 0 0 0 2px var(--gold); }
  .team-line .tn{ font-weight:900; flex:none; display:inline-flex; align-items:center; gap:4px; }
  .team-line .tn .ic{ width:22px; height:22px; }
  .team-line.R{ --eye:var(--red-bg); } .team-line.B{ --eye:var(--blue-bg); }
  .team-line.R .tn{ color:var(--red); }
  .team-line.B .tn{ color:var(--blue); }
  .team-line .mem{ flex:1; min-width:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .team-line .sum{ flex:none; font-size:16px; font-weight:900; color:var(--ink); }
  .team-result{ text-align:center; font-size:13px; font-weight:700; color:var(--ink); padding-top:4px; }
  .team-result .amt{ color:var(--gold); }
  .pot-row{ display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); padding-top:8px; margin-top:4px; border-top:1px solid var(--line); }
  .pot-row b{ color:var(--ink); }
  .team-info{ font-size:12px; color:var(--muted); text-align:center; margin-top:8px; line-height:1.5; }
  .joker-val{ min-width:96px; font-size:17px; }
  .tag-pill{ flex:none; font-size:11px; font-weight:700; padding:2px 6px; border-radius:3px; }
  .tag-pill.R{ color:var(--red); background:var(--red-bg); }
  .tag-pill.B{ color:var(--blue); background:var(--blue-bg); }
  .tag-pill.T{ color:var(--muted); background:var(--surface-2); }

  /* Money inputs: ▲▼ 5,000원 */
  input[type=number]{ -moz-appearance:textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .money-spin{ display:flex; align-items:stretch; min-width:0; }
  .money-spin > input[type=number]{ flex:1 1 0; width:0; min-width:0; }
  .money-spin .spin{ display:flex; flex-direction:column; flex:none; width:28px; }
  .money-spin .spin button{
    flex:1; border:1px solid var(--line); border-left:none; background:var(--surface-2); color:var(--ink);
    font-size:9px; line-height:1; padding:0; cursor:pointer; border-radius:0;
  }
  .money-spin .spin button + button{ border-top:none; }
  .money-spin .spin button:active{ background:var(--sel); color:var(--sel-ink); }
  .unit-input > .money-spin{ flex:none; width:44%; min-width:130px; }
  .two-col .unit-input > .money-spin{ flex:1 1 0; width:0; min-width:0; }
  .handi-col > .money-spin{ width:100%; }
  .tb-list{ display:flex; flex-direction:column; gap:6px; }
  .tb-row{ display:grid; grid-template-columns:64px minmax(0,1fr) auto; align-items:center; gap:6px; }
  .tb-row .tb-name{ font-size:12px; font-weight:700; color:var(--ink); line-height:1.2; }
  .tb-row .tb-name small{ display:block; font-size:10px; font-weight:500; color:var(--muted); }
  .tb-row .money-spin input{ padding:8px 8px; font-size:14px; font-weight:700; text-align:right;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:0; }
  .tb-row .chip-row{ flex-wrap:nowrap; gap:4px; }
  .tb-row .chip.small{ padding:6px 8px; font-size:12px; }
  .three-col .money-spin{ width:100%; }

  /* Achievements */
  .ach{ display:inline-flex; align-items:center; gap:2px; flex:none; }
  .ach-b{ display:inline-flex; }
  .ach-ic{ width:22px; height:22px; display:block; }
  .ach-b.big .ach-ic{ width:26px; height:26px; }
  .hio{
    font-family:'Dancing Script', 'Brush Script MT', cursive; font-weight:700; font-size:17px; line-height:1;
    white-space:nowrap; padding:0 2px 2px;
    background:var(--cele);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 1px 0 rgba(120,80,10,.35)) drop-shadow(0 0 6px rgba(246,215,122,.55));
    animation:shine 2.6s linear infinite;
  }
  .star-wrap{ position:relative; display:inline-flex; align-items:center; min-width:0; padding:0 6px; margin:0 -2px; }
  .star-wrap::before{
    content:''; position:absolute; inset:-6px -4px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(246,215,122,.45), rgba(246,215,122,0));
    animation:glow 1.8s ease-in-out infinite; pointer-events:none;
  }
  .pname.celebrate{
    position:relative; font-weight:900;
    background:var(--cele);
    filter:drop-shadow(0 0 3px rgba(242,201,76,.55));
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 2.6s linear infinite;
  }
  .star-wrap .sp{ position:absolute; font-style:normal; color:#F2C94C; line-height:1; pointer-events:none;
    text-shadow:0 0 4px rgba(255,220,120,.9); animation:twinkle 1.6s ease-in-out infinite; }
  .star-wrap .s1{ top:-9px; left:-2px; font-size:10px; animation-delay:0s; }
  .star-wrap .s2{ top:-11px; left:45%; font-size:8px; animation-delay:.3s; }
  .star-wrap .s3{ top:-8px; right:-4px; font-size:11px; animation-delay:.6s; }
  .star-wrap .s4{ bottom:-9px; left:15%; font-size:8px; animation-delay:.9s; }
  .star-wrap .s5{ bottom:-8px; right:8%; font-size:10px; animation-delay:1.2s; }
  .star-wrap .s6{ top:30%; right:-9px; font-size:7px; animation-delay:.45s; }
  .ach-pill{
    position:relative; display:inline-flex; align-items:center; gap:3px; height:24px; padding:0 9px 0 4px;
    border-radius:12px; flex:none; animation:pillGlow 1.8s ease-in-out infinite;
  }
  .ach-pill .ach-ic{ width:20px; height:20px; }
  .ach-pill .w{
    font-family:'Dancing Script','Brush Script MT',cursive; font-weight:700; font-size:15px; line-height:1; white-space:nowrap;
    background:var(--g); background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 2.4s linear infinite; padding-bottom:1px;
  }
  .ach-pill.birdie{ background:linear-gradient(90deg,rgba(142,91,214,.16),rgba(63,184,198,.2));
    --g:linear-gradient(100deg,#6A2FB8,#2A9FB0 35%,#B46BFF 55%,#6A2FB8); --glow:rgba(142,91,214,.5); }
  .ach-pill.eagle{ background:linear-gradient(90deg,rgba(224,160,48,.2),rgba(110,67,32,.16));
    --g:linear-gradient(100deg,#6E3F0C,#D8951E 35%,#F7C65E 52%,#6E3F0C); --glow:rgba(224,160,48,.55); }
  .ach-pill.alb{ background:linear-gradient(90deg,rgba(255,154,213,.24),rgba(154,205,255,.26),rgba(197,160,255,.24));
    background-size:200% 100%;
    --g:linear-gradient(100deg,#C7327F,#6A4BD6 28%,#1F7FC8 52%,#D8900F 74%,#C7327F); --glow:rgba(170,140,230,.6); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .ach-pill.birdie{ --g:linear-gradient(100deg,#C79BFF,#6FE3EE 35%,#F0D8FF 55%,#C79BFF); }
    :root:not([data-theme="light"]) .ach-pill.eagle{ --g:linear-gradient(100deg,#E0A33A,#FFD98A 40%,#FFF1CF 55%,#E0A33A); }
    :root:not([data-theme="light"]) .ach-pill.alb{ --g:linear-gradient(100deg,#FF8CC6,#B9A2FF 28%,#8CCBFF 52%,#FFD27A 74%,#FF8CC6); }
  }
  :root[data-theme="dark"] .ach-pill.birdie{ --g:linear-gradient(100deg,#C79BFF,#6FE3EE 35%,#F0D8FF 55%,#C79BFF); }
  :root[data-theme="dark"] .ach-pill.eagle{ --g:linear-gradient(100deg,#E0A33A,#FFD98A 40%,#FFF1CF 55%,#E0A33A); }
  :root[data-theme="dark"] .ach-pill.alb{ --g:linear-gradient(100deg,#FF8CC6,#B9A2FF 28%,#8CCBFF 52%,#FFD27A 74%,#FF8CC6); }
  .ach-pill.sheep{ background:linear-gradient(90deg,rgba(255,138,160,.22),rgba(190,190,205,.28));
    --g:linear-gradient(100deg,#B4234A,#E0567A 40%,#FF9BB0 55%,#B4234A); --glow:rgba(224,86,122,.55); }
  .ach-pill.sheep .w{ font-family:inherit; font-weight:900; font-size:13px; letter-spacing:-.2px; }
  .ach-pill.sheep .ach-ic{ width:26px; height:26px; margin:-2px 0; animation:hop 1s ease-in-out infinite; transform-origin:50% 90%; }
  .ach-pill.sheep::after{ content:'💦'; font-size:9px; top:-8px; right:-4px; text-shadow:none; animation:drip 1.2s ease-in infinite; }
  .ach-pill.sheep::before{ content:none; }
  @keyframes hop{ 0%,100%{ transform:translateY(0) rotate(0); } 30%{ transform:translateY(-3px) rotate(-8deg); } 60%{ transform:translateY(0) rotate(6deg); } }
  @keyframes drip{ 0%{ opacity:0; transform:translateY(-2px); } 30%{ opacity:1; } 100%{ opacity:0; transform:translateY(5px); } }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .ach-pill.sheep{ --g:linear-gradient(100deg,#FF7A9C,#FFB3C4 40%,#FFE3EA 55%,#FF7A9C); }
  }
  :root[data-theme="dark"] .ach-pill.sheep{ --g:linear-gradient(100deg,#FF7A9C,#FFB3C4 40%,#FFE3EA 55%,#FF7A9C); }
  .ach-pill::after{ content:'✦'; position:absolute; top:-7px; right:-3px; font-size:10px; color:#F2C94C;
    text-shadow:0 0 4px rgba(255,220,120,.9); animation:twinkle 1.4s ease-in-out infinite; }
  .ach-pill::before{ content:'✧'; position:absolute; bottom:-7px; left:3px; font-size:8px; color:#F2C94C;
    text-shadow:0 0 4px rgba(255,220,120,.9); animation:twinkle 1.4s ease-in-out .7s infinite; }
  .ach-pill.birdie .ach-ic{ animation:flutter .8s ease-in-out infinite; }
  .ach-pill.eagle .ach-ic{ animation:soar 1.6s ease-in-out infinite; }
  .ach-pill.alb .ach-ic{ animation:floaty 1.8s ease-in-out infinite; }
  @keyframes pillGlow{ 0%,100%{ box-shadow:0 0 0 1px var(--glow), 0 0 3px 0 var(--glow); } 50%{ box-shadow:0 0 0 1px var(--glow), 0 0 12px 2px var(--glow); } }
  @keyframes flutter{ 0%,100%{ transform:scaleX(1); } 50%{ transform:scaleX(.5) translateY(-1px); } }
  @keyframes soar{ 0%,100%{ transform:translateY(0) rotate(-5deg); } 50%{ transform:translateY(-2px) rotate(5deg); } }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2px); } }
  .score-row .name-part{ flex-wrap:wrap; row-gap:4px; }
  @keyframes shine{ to{ background-position:-220% 0; } }
  @keyframes twinkle{ 0%,100%{ opacity:.25; transform:scale(.6) rotate(0deg); } 50%{ opacity:1; transform:scale(1.15) rotate(20deg); } }
  @keyframes glow{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .hio, .pname.celebrate, .star-wrap .sp, .star-wrap::before, .ach-pill, .ach-pill *, .ach-pill::before, .ach-pill::after{ animation:none; } }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <button class="icon-btn" id="backBtn" title="뒤로" aria-label="뒤로" hidden>←</button>
    <div class="brand">
      <h1>내기골프계산기</h1>
      <span class="sub">스트로크 내기 자동 계산</span>
    </div>
    <button class="icon-btn" id="historyBtn" title="지난 라운딩" aria-label="지난 라운딩">☰</button>
  </header>

  <!-- MODE SCREEN -->
  <section id="screen-mode" hidden>
    <div class="mode-intro">내기 방식을 선택하세요</div>
    <div class="mode-list">
      <button class="mode-card" data-mode="stroke">
        <div class="art"><svg class="ic g" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M11 3h2v22h-2z"/><path d="M13 3.5 25 8.2 13 13z"/><ellipse cx="12" cy="27" rx="9" ry="2.6" opacity=".35"/><circle cx="19.5" cy="26.2" r="1.3"/></svg></div>
        <div class="tag">STROKE</div>
        <div class="t">스트로크</div>
        <div class="d">타수 차이 1:1 자동 정산<br>배판 · 니어 · 버디 · 롱기</div>
        <div class="go">시작하기 ›</div>
      </button>
      <button class="mode-card" data-mode="team">
        <div class="art"><svg class="ic r" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M21 8.5c2.4 0 4 1.6 4.3 3.4l3.2 1-3.3 1c-.6 2.6-2.6 4.6-5.3 5.2l-4.6 2.4 1.6-4.3c-.5-.8-.8-1.8-.8-2.8 0-3.4 2.3-5.9 4.9-5.9z"/><path d="M20.4 8.7C19.3 6.2 19.6 3.9 21.2 2c-.3 2.2.1 4.2 1.3 6.2zM19 9.3C17.1 7.5 16.2 5.3 16.5 3c.7 2 1.9 3.7 3.6 5z"/><path d="M17.6 14.4C13 13.6 9.2 10.3 7.6 5.5c2.6 2.7 5.6 4.2 8.9 4.5-1.4-1.1-2.3-2.6-2.6-4.3 1.6 1.7 3.5 2.8 5.7 3.1z"/><path d="M16.4 19.2C12.3 22 8.2 22.6 3 21.6c3.6 1.9 7.2 2.1 10.6 1.3-3.2 2.4-6.8 4.6-11.4 5.6 4.6.4 8.8-1 12.1-3.4-1 2.4-2.9 4.4-5.1 5.9 4.2-.6 7.3-3.4 8.6-7.3z"/><circle class="eye" cx="22.3" cy="11.6" r="1"/></svg><svg class="ic b" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M5 31C5 23 8 15 14 10.5 16 9 18.5 8.6 21 9.2L29.5 12.4C30.2 12.7 30.1 13.7 29.3 13.8L21.5 15 28 17.6C28.7 17.9 28.5 18.9 27.7 18.9L19.5 19C17 21.5 14.5 24 13.5 31Z"/><path d="M15.5 10C12.5 7.5 10 5 8 2.5 11.5 3.8 14.5 5.8 17.5 8.8Z"/><path d="M13 12C10 10.5 7 9.5 4.5 9.5 7.5 8.3 10.8 8.6 14 10.3Z"/><path d="M24 15.3C26 17 25 21 21.5 22 23.5 20.5 23.8 18 22.8 16Z"/><path d="M9 17 5.5 16.5 8.2 19.5ZM7.2 22 3.8 22.3 6.8 24.6ZM6.3 27 3 27.8 6 29.6Z"/><circle class="eye" cx="19.6" cy="11.9" r="1.1"/></svg></div>
        <div class="tag">TEAM · 뽑기</div>
        <div class="t">팀전</div>
        <div class="d">불사조 vs 푸른용<br>2:2 뽑기 · 판돈 · 조커</div>
        <div class="go">시작하기 ›</div>
      </button>
    </div>
  </section>

  <!-- SETUP SCREEN -->
  <section id="screen-setup" hidden>
    <div class="card">
      <div class="field">
        <label class="field-label">날짜 / 골프장</label>
        <div class="two-col">
          <input type="date" class="plain" id="roundDateInput">
          <input type="text" class="plain" id="courseNameInput" placeholder="골프장 이름">
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:8px;">
      <div class="field" style="margin-top:0;">
        <label class="field-label">인원</label>
        <div id="pcFixed" hidden style="font-size:16px;font-weight:700;padding:4px 0;">4명 <span style="font-size:12px;font-weight:500;color:var(--muted);">(팀전 고정)</span></div>
        <div class="stepper-row" id="pcStepper">
          <button class="stepper-btn" id="pcMinus" aria-label="인원 줄이기">−</button>
          <div class="stepper-val" id="pcVal">4</div>
          <button class="stepper-btn" id="pcPlus" aria-label="인원 늘리기">+</button>
          <span style="color:var(--muted);font-size:13px;">명</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" id="nameLabel">플레이어 이름 &amp; 핸디</label>
        <div class="field-hint" id="nameHint">시작 전 접대(핸디캡)를 금액으로 미리 줄 경우 입력하세요. 없으면 0.</div>
        <div class="name-list" id="nameList"></div>
      </div>

      <div class="field" id="unitField">
        <label class="field-label">1타당 금액</label>
        <div class="unit-input">
          <input type="number" id="unitInput" inputmode="numeric" value="1000" min="0" step="100">
          <span>원 / 타</span>
        </div>
      </div>

      <div class="two-col" id="teamMoneyRow" hidden>
      <div class="field" id="depositField">
        <label class="field-label">선입금 금액 (1인)</label>
        <div class="unit-input">
          <input type="number" id="depositInput" inputmode="numeric" value="10000" min="0" step="1000">
          <span>원 / 인</span>
        </div>
      </div>
      <div class="field" id="holeAmtField">
        <label class="field-label">홀당 금액 (인당금액)</label>
        <div class="unit-input">
          <input type="number" id="holeAmtInput" inputmode="numeric" value="2000" min="0" step="500">
          <span>원 / 인</span>
        </div>
      </div>
      </div>
      <div class="field-hint" id="potHint" hidden style="margin-top:6px;"></div>
      <div class="field" id="teamBirdieField" hidden>
        <label class="field-label">축하금</label>
        <div id="teamBonusList" class="tb-list"></div>
        <div class="field-hint">총금액차감: 기록한 사람이 판돈에서 가져감 · 별도계산: 나머지 인원이 각자 지급.</div>
      </div>
    </div>

    <div class="card" id="bonusCard" style="margin-top:8px;">
      <div class="field" style="margin-top:0;">
        <label class="field-label">축하금 (1인당 받는 금액)</label>
        <div class="three-col">
          <div>
            <label>버디</label>
            <input type="number" class="text-input" id="bonusBirdie" value="0" min="0" step="500">
          </div>
          <div>
            <label>니어</label>
            <input type="number" class="text-input" id="bonusNear" value="0" min="0" step="500">
          </div>
          <div>
            <label>롱기</label>
            <input type="number" class="text-input" id="bonusLong" value="0" min="0" step="500">
          </div>
        </div>
        <div class="two-col" style="margin-top:6px;">
          <div>
            <label class="mini-label">이글</label>
            <input type="number" class="text-input" id="bonusEagle" value="0" min="0" step="500">
          </div>
          <div>
            <label class="mini-label">홀인원(알바트로스)</label>
            <input type="number" class="text-input" id="bonusHio" value="0" min="0" step="500">
          </div>
        </div>
      </div>
    </div>

    <div class="card" id="jokerCard" style="margin-top:8px;" hidden>
      <div class="field" style="margin-top:0;">
        <label class="field-label">조커 타수</label>
        <div class="stepper-row">
          <button class="stepper-btn" id="jokerMinus" aria-label="조커 타수 줄이기">−</button>
          <div class="stepper-val joker-val" id="jokerVal">파</div>
          <button class="stepper-btn" id="jokerPlus" aria-label="조커 타수 늘리기">+</button>
          <div class="chip-row" id="jokerTypeChips" style="margin-left:auto;">
            <button class="chip small" data-jtype="strokes">타수</button>
            <button class="chip small" data-jtype="score">스코어</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card" id="baepanCard" style="margin-top:8px;">
      <div class="field" style="margin-top:0;">
        <label class="field-label">배판 옵션</label>
        <div class="chip-row" id="baepanCondChips">
          <button class="chip" data-cond="birdie">버디</button>
          <button class="chip" data-cond="tie3">동타 3명</button>
          <button class="chip" data-cond="triple">트리플 이상</button>
          <button class="chip" data-cond="ob">OB</button>
          <button class="chip" data-cond="double3">더블(파3)</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">배판 적용 시점</label>
        <div class="chip-row" id="baepanTimingChips">
          <button class="chip" data-timing="current">당홀 배판</button>
          <button class="chip" data-timing="next">다음홀 배판</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:8px;">
      <div class="field" style="margin-top:0;">
        <label class="field-label">홀 수</label>
        <div class="chip-row" id="holeChips">
          <button class="chip" data-holes="9">9홀</button>
          <button class="chip" data-holes="18">18홀</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:8px;">
      <button class="primary-btn" id="startBtn">라운딩 시작</button>
    </div>
  </section>

  <!-- PLAY SCREEN -->
  <section id="screen-play" hidden>
    <div class="round-meta" id="roundMetaPlay"></div>
    <div class="card">
      <div class="hole-nav">
        <button class="nav-btn" id="holePrev" aria-label="이전 홀">‹</button>
        <div class="hole-title">
          <div class="num" id="holeNum">1</div>
          <div class="of" id="holeOf">/ 18홀</div>
        </div>
        <button class="nav-btn" id="holeNext" aria-label="다음 홀">›</button>
      </div>

      <div class="par-row">
        <span class="lbl">파</span>
        <button class="chip small" data-par="3">3</button>
        <button class="chip small" data-par="4">4</button>
        <button class="chip small" data-par="5">5</button>
        <button class="chip small warn" id="obToggleChip" hidden>OB 발생</button>
      </div>

      <div id="baepanBadge" class="baepan-badge" hidden>🔥 이번 홀 배판 (2배 정산)</div>
      <div id="condRow" class="cond-row"></div>
      <div id="bonusSummary" class="bonus-summary" hidden></div>

      <div id="scoreRows" style="margin-top:8px;"></div>
      <div class="draw-actions" id="drawActions" hidden>
        <button class="ghost-btn" id="drawAllBtn">🎲 한번에 뽑기</button>
        <button class="ghost-btn" id="drawResetBtn">다시 뽑기</button>
      </div>

      <div class="hole-money" id="holeMoney"></div>
    </div>

    <div class="card" style="margin-top:8px;">
      <div class="section-label" id="liveLabel">현재 정산</div>
      <div class="scoreboard" id="liveScoreboard"></div>
    </div>

    <div class="bottom-bar">
      <div class="inner">
        <button class="ghost-btn" id="endRoundBtn" style="flex:none; width:auto; padding-inline:16px;">종료</button>
        <button class="primary-btn" id="nextHoleBtn">이 홀 확정 →</button>
      </div>
    </div>
  </section>

  <!-- SUMMARY SCREEN -->
  <section id="screen-summary" hidden>
    <div class="round-meta" id="roundMetaSummary"></div>
    <div class="card">
      <div class="section-label">최종 결과</div>
      <div class="scoreboard" id="finalScoreboard"></div>
      <div class="team-info" id="summaryInfo" hidden></div>
    </div>

    <div class="card" style="margin-top:8px;">
      <div class="section-label">정산 방법 (최소 송금)</div>
      <div class="settle-list" id="settleList"></div>
    </div>

    <div class="card" style="margin-top:8px;">
      <div class="section-label">홀별 기록</div>
      <div class="hole-log" id="holeLog"></div>
    </div>

    <div class="card" style="margin-top:8px;">
      <div class="section-label">공유하기</div>
      <button class="gold-btn" id="shareBtn">카톡 · 메일로 결과 보내기</button>
      <div class="share-box" id="sharePanel" hidden style="margin-top:8px;">
        <textarea id="shareText" readonly></textarea>
        <div class="share-actions">
          <button class="ghost-btn" id="copyBtn">텍스트 복사하기</button>
          <a class="share-link" id="mailLink" href="#">이메일로 보내기</a>
        </div>
        <div class="copy-note" id="copyNote"></div>
      </div>
    </div>

    <div class="card" style="margin-top:8px; display:flex; flex-direction:column; gap:10px;">
      <button class="primary-btn" id="newRoundBtn">새 라운딩 시작</button>
    </div>
  </section>

  <!-- HISTORY SCREEN -->
  <section id="screen-history" hidden>
    <div class="card">
      <div class="section-label">지난 라운딩</div>
      <div id="historyList" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
    <div class="card" style="margin-top:8px;">
      <button class="ghost-btn" id="historyBackBtn">← 돌아가기</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var PALETTE = ['#2F7A4D','#A9791F','#3B6EA5','#8B4B9C'];
  var SCORE_MIN = -5, SCORE_MAX = 10;

  function todayStr(){
    var d = new Date();
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+mm+'-'+dd;
  }

  var state = {
    mode: 'stroke',          // 'stroke' | 'team'
    deposit: 10000,          // 팀전: 1인 선입금
    holeAmount: 2000,        // 팀전: 홀당 금액
    jokerRel: 0,             // 팀전: 조커 스코어 (파 대비)
    jokerType: 'score',      // 팀전: 'score'(파·보기) | 'strokes'(1·2·3·4타)
    jokerStrokes: 4,         // 팀전: 조커 타수 (절대)
    teamBonus: {             // 팀전 축하금: amt(원), mode 'pot'(총금액차감) | 'separate'(별도계산)
      birdie:{amt:0, mode:'pot'}, near:{amt:0, mode:'pot'}, long:{amt:0, mode:'pot'},
      eagle:{amt:0, mode:'pot'}, hio:{amt:0, mode:'pot'}
    },
    draws: {},               // 팀전: holeNum -> ['R'|'B'|'J'|null per player]
    roundDate: todayStr(),
    courseName: '',
    playerCount: 4,
    names: ['나','친구1','친구2','친구3'],
    handicaps: [0,0,0,0],
    unit: 1000,
    bonuses: { near:0, birdie:0, long:0, eagle:0, hio:0 },
    holeCount: 18,
    currentHole: 1,
    pars: {},              // holeNum -> 3|4|5
    scores: {},             // holeNum -> [파 대비 +/- 타수 per player], 0 = 파
    confirmedHoles: {},
    manualOB: {},            // holeNum -> bool
    nextHoleDoubleFlag: {},   // holeNum -> bool (다음홀 배판 예약)
    baepan: { birdie:false, tie3:false, triple:false, ob:false, double3:false, timing:'current' },
    nearWinner: {},           // holeNum -> playerIdx | null
    longWinner: {},           // holeNum -> playerIdx | null
    lastResultTotals: null,
    lastResultStrokes: null
  };

  var navStack = [];
  var activeScreen = 'setup';

  function $(id){ return document.getElementById(id); }
  function fmt(n){
    var sign = n>0?'+':(n<0?'−':'');
    return sign + Math.abs(n).toLocaleString('ko-KR') + '원';
  }
  function fmtRel(n){
    if(n===0) return '0';
    return (n>0? '+'+n : String(n));
  }
  function moneyClass(n){ return n>0?'pos':(n<0?'neg':'zero'); }
  function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function safeSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }
  function safeRemove(key){ try{ localStorage.removeItem(key); }catch(e){} }
  function escapeHtml(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function fmtDate(str){
    if(!str) return '';
    var p = str.split('-');
    if(p.length<3) return str;
    return p[0]+'.'+p[1]+'.'+p[2];
  }

  // ---------- SCREEN NAV ----------
  function applyScreen(name){
    ['mode','setup','play','summary','history'].forEach(function(s){
      $('screen-'+s).hidden = (s!==name);
    });
    updateBrandSub(name);
    if(name==='play'){ renderPlay(); }
    else if(name==='summary'){ renderSummaryFromState(); }
    else if(name==='history'){ renderHistory(); }
  }
  function showScreen(name){
    if(name!==activeScreen){ navStack.push(activeScreen); }
    activeScreen = name;
    applyScreen(name);
    $('backBtn').hidden = navStack.length===0;
  }
  function goBack(){
    if(!navStack.length) return;
    var prev = navStack.pop();
    activeScreen = prev;
    applyScreen(prev);
    $('backBtn').hidden = navStack.length===0;
  }
  $('backBtn').addEventListener('click', goBack);
  $('historyBackBtn').addEventListener('click', goBack);

  // ---------- SETUP ----------
  $('roundDateInput').value = state.roundDate;
  $('roundDateInput').addEventListener('input', function(e){ state.roundDate = e.target.value; });
  $('courseNameInput').addEventListener('input', function(e){ state.courseName = e.target.value; });

  $('bonusNear').addEventListener('input', function(e){ state.bonuses.near = parseInt(e.target.value,10)||0; });
  $('bonusBirdie').addEventListener('input', function(e){ state.bonuses.birdie = parseInt(e.target.value,10)||0; });
  $('bonusLong').addEventListener('input', function(e){ state.bonuses.long = parseInt(e.target.value,10)||0; });
  $('bonusEagle').addEventListener('input', function(e){ state.bonuses.eagle = parseInt(e.target.value,10)||0; });
  $('bonusHio').addEventListener('input', function(e){ state.bonuses.hio = parseInt(e.target.value,10)||0; });

  function renderNameList(){
    var list = $('nameList');
    list.innerHTML = '';
    for(var i=0;i<state.playerCount;i++){
      (function(i){
        var row = document.createElement('div');
        row.className = 'name-row';

        var dot = document.createElement('div');
        dot.className = 'dot';
        dot.style.background = PALETTE[i%PALETTE.length];
        var input = document.createElement('input');
        input.type = 'text';
        input.value = state.names[i] || ('플레이어'+(i+1));
        input.maxLength = 8;
        input.placeholder = '플레이어'+(i+1);
        input.addEventListener('input', function(e){ state.names[i] = e.target.value; });

        var handiCol = document.createElement('div');
        handiCol.className = 'handi-col';
        var handiLabel = document.createElement('label');
        handiLabel.textContent = '핸디금액';
        var handiInput = document.createElement('input');
        handiInput.type = 'number';
        handiInput.step = '500';
        handiInput.title = '시작 핸디 금액(원)';
        handiInput.value = state.handicaps[i]||0;
        handiInput.addEventListener('input', function(e){ state.handicaps[i] = parseInt(e.target.value,10)||0; });
        handiCol.appendChild(handiLabel);
        handiCol.appendChild(handiInput);
        enhanceMoney(handiInput, true);

        row.appendChild(dot);
        row.appendChild(input);
        row.appendChild(handiCol);
        list.appendChild(row);
      })(i);
    }
  }

  $('pcMinus').addEventListener('click', function(){
    if(state.playerCount>2){ state.playerCount--; renderNameList(); }
  });
  $('pcPlus').addEventListener('click', function(){
    if(state.playerCount<4){ state.playerCount++; renderNameList(); }
  });
  $('pcVal').textContent = state.playerCount;
  var pcObserver = function(){ $('pcVal').textContent = state.playerCount; };
  ['pcMinus','pcPlus'].forEach(function(id){ $(id).addEventListener('click', pcObserver); });

  $('unitInput').addEventListener('input', function(e){
    state.unit = parseInt(e.target.value,10) || 0;
  });

  document.querySelectorAll('#holeChips .chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      state.holeCount = parseInt(chip.dataset.holes,10);
      updateHoleChips();
      if(typeof updatePotHint==='function') updatePotHint();
    });
  });
  function updateHoleChips(){
    document.querySelectorAll('#holeChips .chip').forEach(function(chip){
      chip.setAttribute('aria-pressed', String(parseInt(chip.dataset.holes,10)===state.holeCount));
    });
  }
  updateHoleChips();

  document.querySelectorAll('#baepanCondChips .chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      var key = chip.dataset.cond;
      state.baepan[key] = !state.baepan[key];
      updateBaepanChips();
    });
  });
  document.querySelectorAll('#baepanTimingChips .chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      state.baepan.timing = chip.dataset.timing;
      updateBaepanChips();
    });
  });
  function updateBaepanChips(){
    document.querySelectorAll('#baepanCondChips .chip').forEach(function(chip){
      chip.setAttribute('aria-pressed', String(!!state.baepan[chip.dataset.cond]));
    });
    document.querySelectorAll('#baepanTimingChips .chip').forEach(function(chip){
      chip.setAttribute('aria-pressed', String(chip.dataset.timing===state.baepan.timing));
    });
  }
  updateBaepanChips();

  // ---------- MONEY SPIN (▲▼ 5,000원) ----------
  var MONEY_STEP = 5000;
  function enhanceMoney(input, allowNegative){
    if(!input || input.dataset.spin) return;
    input.dataset.spin = '1';
    input.step = 'any';
    var wrap = document.createElement('div'); wrap.className = 'money-spin';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var spin = document.createElement('div'); spin.className = 'spin';
    [['▲',1,'증가'],['▼',-1,'감소']].forEach(function(d){
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = d[0]; b.setAttribute('aria-label', '5,000원 '+d[2]);
      b.addEventListener('click', function(){
        var cur = parseInt(input.value,10) || 0;
        var next = cur + d[1]*MONEY_STEP;
        if(!allowNegative && next<0) next = 0;
        input.value = next;
        input.dispatchEvent(new Event('input', {bubbles:true}));
      });
      spin.appendChild(b);
    });
    wrap.appendChild(spin);
  }
  ['unitInput','bonusNear','bonusBirdie','bonusLong','bonusEagle','bonusHio','depositInput','holeAmtInput'].forEach(function(id){
    enhanceMoney($(id), false);
  });

  // ---------- MODE ----------
  function updateBrandSub(screen){
    var sub = (screen==='mode') ? '골프 내기 자동 계산'
      : (state.mode==='team' ? '팀전 · 뽑기 내기 자동 계산' : '스트로크 내기 자동 계산');
    document.querySelector('.brand .sub').textContent = sub;
  }
  document.querySelectorAll('.mode-card').forEach(function(card){
    card.addEventListener('click', function(){
      state.mode = card.dataset.mode;
      if(state.mode==='team'){
        state.playerCount = 4;
        for(var i=0;i<4;i++){
          if(!state.names[i]) state.names[i] = (i===0?'나':'친구'+i);
          if(state.handicaps[i]==null) state.handicaps[i] = 0;
        }
      }
      applyModeToSetup();
      showScreen('setup');
    });
  });
  function applyModeToSetup(){
    var team = state.mode==='team';
    $('pcStepper').hidden = team;
    $('pcFixed').hidden = !team;
    $('pcVal').textContent = state.playerCount;
    $('nameList').classList.toggle('no-handi', team);
    $('nameLabel').textContent = team ? '플레이어 이름' : '플레이어 이름 & 핸디';
    $('nameHint').textContent = team ? '4명의 이름을 입력하세요. 팀은 매 홀 뽑기로 정해져요.'
      : '시작 전 접대(핸디캡)를 금액으로 미리 줄 경우 입력하세요. 없으면 0.';
    $('unitField').hidden = team;
    $('teamMoneyRow').hidden = !team;
    $('potHint').hidden = !team;
    $('teamBirdieField').hidden = !team;
    renderTeamBonusList();
    $('bonusCard').hidden = team;
    $('baepanCard').hidden = team;
    $('jokerCard').hidden = !team;
    $('depositInput').value = state.deposit;
    $('holeAmtInput').value = state.holeAmount;
    $('startBtn').textContent = team ? '팀전 시작' : '라운딩 시작';
    renderNameList();
    updatePotHint();
    updateJokerVal();
    updateBrandSub(activeScreen);
  }
  function updatePotHint(){
    var pot = state.deposit*4;
    var per = state.holeCount ? Math.floor(pot/state.holeCount/2) : 0;
    $('potHint').textContent = '판돈 '+pot.toLocaleString('ko-KR')+'원 · '+state.holeCount+'홀 기준 인당 약 '
      + per.toLocaleString('ko-KR')+'원. 이긴 팀 2명이 각자 이 금액을 판돈에서 가져가요 (홀당 '
      + (state.holeAmount*2).toLocaleString('ko-KR')+'원 소진). 동점이면 다음 홀로 이월.';
  }
  var REL_LABEL = {'-3':'알바트로스','-2':'이글','-1':'버디','0':'파','1':'보기','2':'더블','3':'트리플'};
  function relLabel(r){ return REL_LABEL[String(r)] || ((r>0?'+':'')+r); }
  function updateJokerVal(){
    document.querySelectorAll('#jokerTypeChips .chip').forEach(function(chip){
      chip.setAttribute('aria-pressed', String(chip.dataset.jtype===state.jokerType));
    });
    if(state.jokerType==='strokes'){ $('jokerVal').textContent = state.jokerStrokes+'타'; return; }
    var r = state.jokerRel;
    $('jokerVal').textContent = relLabel(r) + (r!==0 && REL_LABEL[String(r)] ? ' ('+fmtRel(r)+')' : '');
  }
  $('depositInput').addEventListener('input', function(e){ state.deposit = parseInt(e.target.value,10)||0; updatePotHint(); });
  $('holeAmtInput').addEventListener('input', function(e){ state.holeAmount = parseInt(e.target.value,10)||0; updatePotHint(); });
  var TEAM_BONUS_KEYS = [
    ['birdie','버디',''], ['near','니어','파3'], ['long','롱기','파5'], ['eagle','이글',''], ['hio','홀인원','(알바트로스)']
  ];
  function normTeamBonus(){
    if(!state.teamBonus) state.teamBonus = {};
    TEAM_BONUS_KEYS.forEach(function(k){
      if(!state.teamBonus[k[0]]) state.teamBonus[k[0]] = {amt:0, mode:'pot'};
    });
    // 이전 버전(버디만) 데이터 호환
    if(state.teamBirdie!=null){
      state.teamBonus.birdie = {amt:state.teamBirdie||0, mode:state.teamBirdieMode==='separate'?'separate':'pot'};
      delete state.teamBirdie; delete state.teamBirdieMode;
    }
  }
  function renderTeamBonusList(){
    normTeamBonus();
    var box = $('teamBonusList');
    box.innerHTML = '';
    TEAM_BONUS_KEYS.forEach(function(k){
      var key = k[0], cfg = state.teamBonus[key];
      var row = document.createElement('div'); row.className = 'tb-row';
      var nm = document.createElement('div'); nm.className = 'tb-name';
      nm.innerHTML = k[1] + (k[2] ? '<small>'+k[2]+'</small>' : '');
      var input = document.createElement('input');
      input.type = 'number'; input.inputMode = 'numeric'; input.min = '0'; input.value = cfg.amt||0;
      input.setAttribute('aria-label', k[1]+' 축하금');
      input.addEventListener('input', function(e){ cfg.amt = parseInt(e.target.value,10)||0; });
      var holder = document.createElement('div'); holder.appendChild(input);
      var chips = document.createElement('div'); chips.className = 'chip-row';
      [['pot','총금액차감'],['separate','별도계산']].forEach(function(m){
        var c = document.createElement('button');
        c.className = 'chip small'; c.textContent = m[1];
        c.setAttribute('aria-pressed', String(cfg.mode===m[0]));
        c.addEventListener('click', function(){
          cfg.mode = m[0];
          chips.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', String(x===c)); });
        });
        chips.appendChild(c);
      });
      row.appendChild(nm); row.appendChild(holder); row.appendChild(chips);
      box.appendChild(row);
      enhanceMoney(input, false);
      // enhanceMoney wraps the input; use the wrapper as the grid cell
      holder.replaceWith(input.parentNode);
    });
  }
  $('jokerMinus').addEventListener('click', function(){
    if(state.jokerType==='strokes'){ if(state.jokerStrokes>1) state.jokerStrokes--; }
    else if(state.jokerRel>-3){ state.jokerRel--; }
    updateJokerVal();
  });
  $('jokerPlus').addEventListener('click', function(){
    if(state.jokerType==='strokes'){ if(state.jokerStrokes<12) state.jokerStrokes++; }
    else if(state.jokerRel<5){ state.jokerRel++; }
    updateJokerVal();
  });
  document.querySelectorAll('#jokerTypeChips .chip').forEach(function(chip){
    chip.addEventListener('click', function(){ state.jokerType = chip.dataset.jtype; updateJokerVal(); });
  });
  function jokerRelFor(h){
    return state.jokerType==='strokes' ? state.jokerStrokes - (state.pars[h]||4) : state.jokerRel;
  }
  function jokerLabel(){
    return state.jokerType==='strokes' ? state.jokerStrokes+'타' : relLabel(state.jokerRel);
  }

  // ---------- TEAM LOGIC ----------
  var BALLS = ['R','R','B','B','J'];
  var BALL_LABEL = {R:'불사조', B:'푸른용', J:'조커'};

  function getDraw(h){
    if(!state.draws[h]) state.draws[h] = new Array(state.playerCount).fill(null);
    return state.draws[h];
  }
  function remainingBalls(h){
    var pool = BALLS.slice();
    getDraw(h).forEach(function(b){ if(b){ var k=pool.indexOf(b); if(k>-1) pool.splice(k,1); } });
    return pool;
  }
  function drawFor(h,i){
    var d = getDraw(h);
    if(d[i]) return;
    var pool = remainingBalls(h);
    d[i] = pool[Math.floor(Math.random()*pool.length)];
  }
  function drawAll(h){
    state.draws[h] = new Array(state.playerCount).fill(null);
    for(var i=0;i<state.playerCount;i++) drawFor(h,i);
  }
  function teamsForHole(h){
    var d = getDraw(h), R=[], B=[], J=null, all=true;
    d.forEach(function(b,i){
      if(b==='R') R.push(i); else if(b==='B') B.push(i); else if(b==='J') J=i; else all=false;
    });
    if(J!=null){ if(R.length<B.length) R.push(J); else B.push(J); }
    return { valid: all && R.length===2 && B.length===2, R:R, B:B, joker:J };
  }
  function effRel(h,i){ return getDraw(h)[i]==='J' ? jokerRelFor(h) : state.scores[h][i]; }
  // Walks holes in order: confirmed holes plus (optionally) the hole being previewed.
  function teamLedger(previewHole){
    var n = state.playerCount;
    var pot = state.deposit*n, carry = 0;
    var won = new Array(n).fill(0), birdie = new Array(n).fill(0), results = {};
    for(var h=1; h<=state.holeCount; h++){
      if(!state.confirmedHoles[h] && h!==previewHole) continue;
      var t = teamsForHole(h), par = state.pars[h]||4;
      var r = { teams:t, carryIn:carry, stake:state.holeAmount+carry, potBefore:pot, winner:null, paid:0, per:0, awards:[] };
      var awardList = teamAwardsForHole(h);
      // 별도계산 축하금: 나머지 인원이 각자 지급
      awardList.forEach(function(aw){
        if(aw.mode!=='separate') return;
        for(var j=0;j<n;j++){ if(j!==aw.i){ birdie[aw.i]+=aw.amt; birdie[j]-=aw.amt; } }
        r.awards.push({i:aw.i, kind:aw.kind, mode:'separate', got:aw.amt*(n-1)});
      });
      if(t.valid){
        r.sumR = t.R.reduce(function(a,i){ return a+effRel(h,i); },0);
        r.sumB = t.B.reduce(function(a,i){ return a+effRel(h,i); },0);
        if(r.sumR===r.sumB){
          r.winner = 'tie'; carry = r.stake;
        } else {
          r.winner = r.sumR<r.sumB ? 'R' : 'B';
          var per = Math.min(r.stake, Math.floor(pot/2));
          r.per = per; r.paid = per*2; pot -= r.paid; carry = 0;
          t[r.winner].forEach(function(i){ won[i]+=per; });
        }
      }
      // 총금액차감 축하금: 판돈에서 가져감
      awardList.forEach(function(aw){
        if(aw.mode==='separate') return;
        var take = Math.min(aw.amt, pot);
        pot -= take; won[aw.i] += take;
        r.awards.push({i:aw.i, kind:aw.kind, mode:'pot', got:take});
      });
      r.potAfter = pot; r.carryOut = carry;
      results[h] = r;
    }
    return { pot:pot, carry:carry, won:won, birdie:birdie, results:results };
  }
  function teamAwardsForHole(h){
    normTeamBonus();
    var n = state.playerCount, par = state.pars[h]||4, list = [];
    for(var i=0;i<n;i++){
      var tier = bonusTier(h,i);
      if(tier && state.teamBonus[tier].amt>0) list.push({i:i, kind:tier, amt:state.teamBonus[tier].amt, mode:state.teamBonus[tier].mode});
    }
    if(par===3 && state.nearWinner[h]!=null && state.teamBonus.near.amt>0)
      list.push({i:state.nearWinner[h], kind:'near', amt:state.teamBonus.near.amt, mode:state.teamBonus.near.mode});
    if(par===5 && state.longWinner[h]!=null && state.teamBonus.long.amt>0)
      list.push({i:state.longWinner[h], kind:'long', amt:state.teamBonus.long.amt, mode:state.teamBonus.long.mode});
    return list;
  }
  function teamFinal(){

  // ---------- BAEPAN / BONUS LOGIC ----------
  // state.scores[h][i] is stored as strokes relative to par (0 = par, -1 = birdie, +3 = triple bogey, ...)
  function autoConditionsForHole(h){
    var rel = state.scores[h];
    var birdie=false, triple=false, double3=false;
    var par = state.pars[h]||4;
    rel.forEach(function(s){
      if(s<=-1) birdie=true;
      if(s>=3) triple=true;
      if(par===3 && s>=2) double3=true;
    });
    var counts={};
    rel.forEach(function(s){ counts[s]=(counts[s]||0)+1; });
    var tie3=false;
    Object.keys(counts).forEach(function(k){ if(counts[k]>=3) tie3=true; });
    return {birdie:birdie, triple:triple, tie3:tie3, double3:double3};
  }

  function conditionsTriggered(h){
    var auto = autoConditionsForHole(h);
    var trig = false;
    if(state.baepan.birdie && auto.birdie) trig=true;
    if(state.baepan.tie3 && auto.tie3) trig=true;
    if(state.baepan.triple && auto.triple) trig=true;
    if(state.baepan.double3 && auto.double3) trig=true;
    if(state.baepan.ob && state.manualOB[h]) trig=true;
    return trig;
  }

  function isHoleDoubled(h){
    if(state.nextHoleDoubleFlag[h]) return true;
    if(state.baepan.timing==='current' && conditionsTriggered(h)) return true;
    return false;
  }

  var anyBaepanEnabled = function(){
    return state.baepan.birdie || state.baepan.tie3 || state.baepan.triple || state.baepan.ob || state.baepan.double3;
  };

  function pairwiseHoleDeltas(h){
    var rel = state.scores[h];
    var n = state.playerCount;
    var net = new Array(n).fill(0);
    var mult = isHoleDoubled(h) ? 2 : 1;
    for(var i=0;i<n;i++){
      for(var j=i+1;j<n;j++){
        var diff = rel[j]-rel[i]; // positive => i had fewer strokes => i wins (par cancels out)
        var amt = diff*state.unit*mult;
        net[i]+=amt;
        net[j]-=amt;
      }
    }
    return net;
  }

  function bonusDeltas(h){
    var n = state.playerCount;
    var net = new Array(n).fill(0);
    var rel = state.scores[h];

    // 버디·이글·홀인원(알바트로스): 가장 높은 기록 하나만, 나머지 인원이 각자 지급
    for(var i=0;i<n;i++){
      var tier = bonusTier(h,i);
      var amt = tier ? (state.bonuses[tier]||0) : 0;
      if(amt>0){
        for(var j=0;j<n;j++){ if(j!==i){ net[i]+=amt; net[j]-=amt; } }
      }
    }
    if(state.bonuses.near>0 && state.nearWinner[h]!=null && (state.pars[h]||4)===3){
      var w = state.nearWinner[h];
      for(var j2=0;j2<n;j2++){ if(j2!==w){ net[w]+=state.bonuses.near; net[j2]-=state.bonuses.near; } }
    }
    if(state.bonuses.long>0 && state.longWinner[h]!=null && (state.pars[h]||4)===5){
      var w2 = state.longWinner[h];
      for(var j3=0;j3<n;j3++){ if(j3!==w2){ net[w2]+=state.bonuses.long; net[j3]-=state.bonuses.long; } }
    }
    return net;
  }

  function combinedHoleDeltas(h){
    var a = pairwiseHoleDeltas(h);
    var b = bonusDeltas(h);
    return a.map(function(v,idx){ return v+b[idx]; });
  }

  // totals: money totals (handicap baseline + all confirmed holes)
  // strokesAbs: actual total strokes (par + relative), for the final result display
  // relSum: cumulative +/- vs par, for the live in-round scoreboard
  function totalsUpTo(hole){
    var n = state.playerCount;
    var totals = new Array(n).fill(0);
    var team = state.mode==='team';
    for(var k=0;k<n;k++){ totals[k] = team ? 0 : (state.handicaps[k]||0); }
    var strokesAbs = new Array(n).fill(0);
    var relSum = new Array(n).fill(0);
    for(var h=1; h<=hole; h++){
      if(!state.confirmedHoles[h]) continue;
      var rel = state.scores[h];
      var par = state.pars[h]||4;
      var net = team ? new Array(n).fill(0) : combinedHoleDeltas(h);
      for(var k2=0;k2<n;k2++){
        totals[k2]+=net[k2];
        strokesAbs[k2]+=par+rel[k2];
        relSum[k2]+=rel[k2];
      }
    }
    return {totals:totals, strokesAbs:strokesAbs, relSum:relSum};
  }

  function achievementFor(h,i){
    var par = state.pars[h]||4, rel = state.scores[h][i], abs = par+rel;
    // 1타 = 무조건 홀인원 / 알바트로스 = -3 이하(홀인원 제외) / 이글 = -2(홀인원 제외)
    var a = { hio: abs===1, alb: false, eagle: false, birdie: rel===-1, sheep: abs>=par*2 };
    a.alb = rel<=-3 && !a.hio;
    a.eagle = rel===-2 && !a.hio;
    a.celebrate = a.hio || a.alb;
    return a;
  }
  // 축하금 등급: 가장 높은 것 하나만
  function bonusTier(h,i){
    var a = achievementFor(h,i);
    if(a.hio || a.alb) return 'hio';
    if(a.eagle) return 'eagle';
    if(a.birdie) return 'birdie';
    return null;
  }

    updateRoundMeta();
    var h = state.currentHole;
    $('holeNum').textContent = h;
    $('holeOf').textContent = '/ '+state.holeCount+'홀';
    $('holePrev').disabled = h<=1;
    $('holeNext').disabled = h>=state.holeCount;

    document.querySelectorAll('.par-row .chip[data-par]').forEach(function(chip){
      chip.setAttribute('aria-pressed', String(parseInt(chip.dataset.par,10)===(state.pars[h]||4)));
      chip.onclick = function(){
        state.pars[h] = parseInt(this.dataset.par,10);
        renderPlay();
      };
    });

    var obChip = $('obToggleChip');
    var team = state.mode==='team';
    obChip.hidden = team || !state.baepan.ob;
    obChip.setAttribute('aria-pressed', String(!!state.manualOB[h]));
    obChip.onclick = function(){
      state.manualOB[h] = !state.manualOB[h];
      renderPlay();
    };

    var rows = $('scoreRows');
    rows.innerHTML = '';
    for(var i=0;i<state.playerCount;i++){
      (function(i){
        var row = document.createElement('div');
        row.className = 'score-row';

        var namePart = document.createElement('div');
        namePart.className = 'name-part';
        var dot = document.createElement('div');
        dot.className='dot'; dot.style.background = PALETTE[i%PALETTE.length];
        var name = document.createElement('div');
        name.className='pname'; name.textContent = state.names[i]||('플레이어'+(i+1));
        var ach = achievementFor(h,i);
        var nameEl = decorateName(name, ach);
        var badges = achBadges(ach);
        namePart.appendChild(dot);
        if(team){
          var stack = document.createElement('div');
          stack.className = 'name-stack';
          stack.appendChild(nameEl);
          if(badges) stack.appendChild(badges);
          var ball = getDraw(h)[i];
          if(ball){
            var tag = document.createElement('span');
            tag.className = 'ball '+ball;
            tag.innerHTML = (ICON[ball]||'') + BALL_LABEL[ball] + (ball==='J' ? ' · '+jokerLabel() : '');
            stack.appendChild(tag);
          } else {
            var db = document.createElement('button');
            db.className = 'draw-btn'; db.textContent = '🎲 뽑기';
            db.addEventListener('click', function(){ drawFor(h,i); renderPlay(); });
            stack.appendChild(db);
          }
          namePart.appendChild(stack);
        } else {
          namePart.appendChild(nameEl);
          if(badges) namePart.appendChild(badges);
        }

        var stepRow = document.createElement('div');
        stepRow.className='stepper-row';
        var minus = document.createElement('button');
        minus.className='stepper-btn'; minus.textContent='−'; minus.setAttribute('aria-label','타수 감소');
        var val = document.createElement('div');
        val.className='stepper-val'; val.textContent = fmtRel(state.scores[h][i]);
        var plus = document.createElement('button');
        plus.className='stepper-btn'; plus.textContent='+'; plus.setAttribute('aria-label','타수 증가');
        minus.addEventListener('click', function(){
          if(state.scores[h][i]>SCORE_MIN){ state.scores[h][i]--; renderPlay(); }
        });
        plus.addEventListener('click', function(){
          if(state.scores[h][i]<SCORE_MAX){ state.scores[h][i]++; renderPlay(); }
        });
        stepRow.appendChild(minus); stepRow.appendChild(val); stepRow.appendChild(plus);

        row.appendChild(namePart);
        var holePar = state.pars[h]||4;

        var nearOn = team ? (state.teamBonus && state.teamBonus.near.amt>0) : state.bonuses.near>0;
        var longOn = team ? (state.teamBonus && state.teamBonus.long.amt>0) : state.bonuses.long>0;
        if(nearOn && holePar===3){
          var nearBtn = document.createElement('button');
          nearBtn.className='nl-toggle'; nearBtn.textContent='니어'; nearBtn.title='니어 선택';
          nearBtn.setAttribute('aria-pressed', String(state.nearWinner[h]===i));
          nearBtn.addEventListener('click', function(){
            state.nearWinner[h] = (state.nearWinner[h]===i ? null : i);
            renderPlay();
          });
          row.appendChild(nearBtn);
        }
        if(longOn && holePar===5){
          var longBtn = document.createElement('button');
          longBtn.className='nl-toggle'; longBtn.textContent='롱기'; longBtn.title='롱기 선택';
          longBtn.setAttribute('aria-pressed', String(state.longWinner[h]===i));
          longBtn.addEventListener('click', function(){
            state.longWinner[h] = (state.longWinner[h]===i ? null : i);
            renderPlay();
          });
          row.appendChild(longBtn);
        }
        row.appendChild(stepRow);

        rows.appendChild(row);
      })(i);
    }

    $('drawActions').hidden = !team;
    if(team){
      $('baepanBadge').hidden = true;
      $('condRow').innerHTML = '';
      $('bonusSummary').hidden = true;
    } else {
      renderBaepanBadges(h);
      renderBonusSummary(h);
    }
    refreshHoleMoney();
    refreshLiveScoreboard();

    var ready = !team || teamsForHole(h).valid;
    $('nextHoleBtn').disabled = !ready;
    $('nextHoleBtn').textContent = !ready ? '뽑기 완료 후 확정'
      : ((h>=state.holeCount) ? '이 홀 확정 · 마지막 홀' : '이 홀 확정 →');
  }

  function renderBaepanBadges(h){
    $('baepanBadge').hidden = !isHoleDoubled(h);

    var condRow = $('condRow');
    condRow.innerHTML = '';
    if(!anyBaepanEnabled()){ return; }
    var auto = autoConditionsForHole(h);
    var defs = [
      {key:'birdie', label:'버디', on:auto.birdie},
      {key:'tie3', label:'동타 3명', on:auto.tie3},
      {key:'triple', label:'트리플 이상', on:auto.triple},
      {key:'double3', label:'더블(파3)', on:auto.double3},
      {key:'ob', label:'OB', on:!!state.manualOB[h]}
    ];
    defs.forEach(function(d){
      if(!state.baepan[d.key]) return;
      var b = document.createElement('div');
      b.className = 'cond-badge'+(d.on?' on':'');

  function renderBonusSummary(h){
    var el = $('bonusSummary');
    var parts = [];
    for(var i=0;i<state.playerCount;i++){
      var tier = bonusTier(h,i);
      if(tier && (state.bonuses[tier]||0)>0) parts.push(TIER_LABEL[tier]+' '+(state.names[i]||('P'+(i+1))));
    }
    if(state.bonuses.near>0 && state.nearWinner[h]!=null && (state.pars[h]||4)===3){
      parts.push('니어 '+(state.names[state.nearWinner[h]]||''));
    }
    if(state.bonuses.long>0 && state.longWinner[h]!=null && (state.pars[h]||4)===5){
      parts.push('롱기 '+(state.names[state.longWinner[h]]||''));
    }
    el.textContent = parts.join('   ');
    el.hidden = parts.length===0;

    var box = $('holeMoney');

    titleRow.style.fontWeight='700'; titleRow.style.color='var(--ink)'; titleRow.style.marginBottom='2px';
    titleRow.textContent = '이번 홀 정산' + (isHoleDoubled(h)?' (2배 적용)':'');
    box.appendChild(titleRow);

    for(var i=0;i<state.playerCount;i++){
      var line = document.createElement('div');

  function computeSettlement(totals){
    var creditors = [], debtors = [];
    var bal = totals.map(function(t,idx){ return {idx:idx, amt:t}; });
    bal.forEach(function(b){
      if(b.amt>0) creditors.push({idx:b.idx, amt:b.amt});
      else if(b.amt<0) debtors.push({idx:b.idx, amt:-b.amt});
    });
    creditors.sort(function(a,b){return b.amt-a.amt;});
    debtors.sort(function(a,b){return b.amt-a.amt;});
    var ci=0, di=0;
    var transfers = [];
    while(ci<creditors.length && di<debtors.length){
      var c = creditors[ci], d = debtors[di];
      var amt = Math.min(c.amt, d.amt);
      if(amt>0.5){
        transfers.push({from:d.idx, to:c.idx, amt:Math.round(amt)});
      }
      c.amt-=amt; d.amt-=amt;
      if(c.amt<=0.5) ci++;
      if(d.amt<=0.5) di++;
    }
    return transfers;
  }

      var item = document.createElement('div');
      item.className='settle-item';
      var from = document.createElement('b'); from.textContent = state.names[t.from]||('플레이어'+(t.from+1));
